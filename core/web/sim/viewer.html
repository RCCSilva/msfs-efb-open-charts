<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open Charts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/map.css">
  <link rel="stylesheet" href="/viewer.css">
  <!-- Must run before leaflet.js: no CSS 3D transforms in the sim's browser. -->
  <script>window.L_DISABLE_3D = true;</script>
  <script src="/vendor/leaflet/leaflet.js"></script>
</head>
<body>
  <div id="map"></div>

  <div id="simnote" class="simnote"></div>

  <div id="bar" class="bar">
    <div class="row">
      <input id="q" type="text" autocomplete="off" spellcheck="false">
      <button id="btn-star" type="button" class="tool" aria-label="Pin to flight">
        <svg viewBox="0 0 32 32"><path d="M16 4l3.6 7.6 8.4 1.1-6.1 5.8 1.5 8.3L16 22.7 8.6 26.8l1.5-8.3L4 12.7l8.4-1.1z"/></svg>
      </button>
      <button id="btn-kbd" type="button" class="tool" aria-label="Keyboard">
        <svg viewBox="0 0 32 32"><rect x="3" y="9" width="26" height="14" rx="2"/><path d="M7 14h2M12 14h2M17 14h2M22 14h3M9 19h14"/></svg>
      </button>
      <button id="btn-flight" type="button" class="tool wide"></button>
      <button id="btn-mode" type="button" class="tool wide"></button>
    </div>
    <div id="pins" class="pins"></div>
    <div id="results" class="panel hidden"></div>
    <div id="flights" class="panel hidden"></div>
    <div id="kbd" class="kbd hidden"></div>
  </div>

  <div id="status" class="status">...</div>

  <div id="controls" class="controls">
    <button id="btn-zoom-in" type="button" aria-label="Zoom in">
      <svg viewBox="0 0 32 32"><path d="M16 7v18M7 16h18"/></svg>
    </button>
    <button id="btn-zoom-out" type="button" aria-label="Zoom out">
      <svg viewBox="0 0 32 32"><path d="M7 16h18"/></svg>
    </button>
    <button id="btn-follow" type="button" class="active" aria-label="Follow aircraft">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="7"/><path d="M16 3v6M16 23v6M3 16h6M23 16h6"/></svg>
    </button>
    <button id="btn-fit" type="button" aria-label="Show whole chart">
      <svg viewBox="0 0 32 32"><path d="M5 12V5h7M20 5h7v7M27 20v7h-7M12 27H5v-7"/></svg>
    </button>
    <button id="btn-opacity" type="button" aria-label="Chart opacity">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10"/><path d="M16 6v20"/></svg>
    </button>
  </div>

  <div id="attribution" class="attribution">&copy; OpenStreetMap contributors</div>

  <script src="/geo.js"></script>
  <script src="/viewer.js"></script>
</body>
</html>
