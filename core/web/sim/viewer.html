<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open Charts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/map.css">
  <link rel="stylesheet" href="/viewer.css">
  <!-- Must run before leaflet.js: no CSS 3D transforms in the sim's browser. -->
  <script>window.L_DISABLE_3D = true;</script>
  <script src="/vendor/leaflet/leaflet.js"></script>
</head>
<body>
  <div id="map"></div>

  <!-- A black band as tall as the simulator tablet's own header: nothing is drawn under it. -->
  <div class="topband"></div>

  <!-- Clean view: hides every control, so only the chart or the map is left. Always visible. -->
  <!-- The pinned charts list: shown or hidden (the chart on screen stays). Left of the eye. -->
  <button id="btn-search" type="button" class="cleanbtn searchbtn" aria-label="Search charts">
    <svg viewBox="0 0 32 32"><circle cx="14" cy="14" r="8"/><path d="M20 20l8 8"/></svg>
  </button>
  <button id="btn-strip" type="button" class="cleanbtn stripbtn" aria-label="Pinned charts">
    <svg viewBox="0 0 32 32"><path d="M5 9h13M5 16h13M5 23h13"/><path d="M23 7h6l-.7 6 2.7 3.4H20l2.7-3.4z"/><path d="M26 16.5V26"/></svg>
  </button>
  <button id="btn-clean" type="button" class="cleanbtn" aria-label="Hide controls">
    <svg viewBox="0 0 32 32"><path d="M3 16C6.5 10 11 7.5 16 7.5S25.5 10 29 16C25.5 22 21 24.5 16 24.5S6.5 22 3 16z"/><circle cx="16" cy="16" r="4"/><path class="slash" d="M6 26L26 6"/></svg>
  </button>

  <div id="bar" class="bar">
    <!-- Row 1: find a chart, pin it, choose the group -->
    <div class="row">
      <!-- the route: this box says what it is and opens the box to paste a route -->
      <button id="btn-routebox" type="button" class="routebox"><span id="routesum"></span></button>
      <button id="btn-route" type="button" class="tool" aria-label="Route">
        <svg viewBox="0 0 32 32"><path d="M5 25l8-12 6 7 8-12"/><circle cx="5" cy="25" r="2.2"/><circle cx="27" cy="8" r="2.2"/></svg>
      </button>
      <button id="btn-star" type="button" class="tool pinbig" aria-label="Pin chart">
        <svg viewBox="0 0 32 32"><path d="M11 4h10l-1 9 4 5H8l4-5z"/><path d="M16 18v10"/></svg><span id="star-label"></span>
      </button>
    </div>
  </div>

  <!-- The box to paste a route in. It stays open while something in the route needs a look. -->
  <div id="routemodal" class="routemodal hidden">
    <div class="routebox2">
      <div id="routetitle" class="routetitle"></div>
      <textarea id="q" rows="3" autocomplete="off" spellcheck="false"></textarea>
      <div id="routeproblems" class="routeproblems"></div>
      <div class="routeactions">
        <button id="btn-kbd" type="button" class="rbtn" aria-label="Keyboard">
          <svg viewBox="0 0 32 32"><rect x="3" y="9" width="26" height="14" rx="2"/><path d="M7 14h2M12 14h2M17 14h2M22 14h3M9 19h14"/></svg>
        </button>
        <button id="route-clear" type="button" class="rbtn"></button>
        <button id="route-cancel" type="button" class="rbtn"></button>
        <button id="route-go" type="button" class="rbtn go"></button>
      </div>
      <div id="kbd" class="kbd hidden"></div>
    </div>
  </div>

  <!-- Left drawer: the route, one container per place, each with a menu of its own (three dots) -->
  <div id="routedrawer" class="drawer left hidden">
    <div class="dhead">
      <span id="rd-title" class="dtitle"></span>
      <button id="rd-paste" type="button" class="rbtn"></button>
      <button id="rd-close" type="button" class="dclose" aria-label="Close"><svg viewBox="0 0 32 32"><path d="M9 9l14 14M23 9L9 23"/></svg></button>
    </div>
    <div id="rd-scroll" class="dscroll">
      <div id="routehead" class="routehead"></div>
      <div id="routechips" class="dlist"></div>
      <div id="savedhead" class="dgroup"></div>
      <div id="savedroutes" class="dlist"></div>
    </div>
    <div class="dnav">
      <button id="rd-up" type="button" class="navbtn" aria-label="Up"><svg viewBox="0 0 32 32"><path d="M6 21l10-11 10 11"/></svg></button>
      <button id="rd-down" type="button" class="navbtn" aria-label="Down"><svg viewBox="0 0 32 32"><path d="M6 11l10 11 10-11"/></svg></button>
    </div>
  </div>

  <!-- Right drawer: the pinned charts of the group, or the search for charts -->
  <div id="chartdrawer" class="drawer right hidden">
    <div class="dhead">
      <span id="cd-title" class="dtitle"></span>
      <button id="cd-close" type="button" class="dclose" aria-label="Close"><svg viewBox="0 0 32 32"><path d="M9 9l14 14M23 9L9 23"/></svg></button>
    </div>
    <div id="cd-scroll" class="dscroll">
    <div id="cd-pinned" class="hidden">
      <div id="pins" class="dlist"></div>
    </div>
    <div id="cd-search" class="hidden">
      <div class="searchrow">
        <input id="cq" type="text" autocomplete="off" spellcheck="false">
        <button id="btn-kbd2" type="button" class="rbtn" aria-label="Keyboard">
          <svg viewBox="0 0 32 32"><rect x="3" y="9" width="26" height="14" rx="2"/><path d="M7 14h2M12 14h2M17 14h2M22 14h3M9 19h14"/></svg>
        </button>
      </div>
      <div id="kbd2" class="kbd hidden"></div>
      <div id="results" class="dlist"></div>
    </div>
    </div>
    <div class="dnav">
      <button id="cd-up" type="button" class="navbtn" aria-label="Up"><svg viewBox="0 0 32 32"><path d="M6 21l10-11 10 11"/></svg></button>
      <button id="cd-down" type="button" class="navbtn" aria-label="Down"><svg viewBox="0 0 32 32"><path d="M6 11l10 11 10-11"/></svg></button>
    </div>
  </div>

  <div id="status" class="status">...</div>

  <!-- Shown while a chart is being loaded: big charts take a while, and the user must see it. -->
  <div id="loading" class="loading hidden"></div>

  <!-- Navigation: where the map is looking -->
  <div id="controls" class="controls">
    <button id="btn-zoom-in" type="button" aria-label="Zoom in">
      <svg viewBox="0 0 32 32"><path d="M16 7v18M7 16h18"/></svg>
    </button>
    <button id="btn-zoom-out" type="button" aria-label="Zoom out">
      <svg viewBox="0 0 32 32"><path d="M7 16h18"/></svg>
    </button>
    <button id="btn-follow" type="button" class="active" aria-label="Follow aircraft">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="7"/><path d="M16 3v6M16 23v6M3 16h6M23 16h6"/></svg>
    </button>
    <button id="btn-orient" type="button" aria-label="Map orientation">
      <!-- a compass (north up); while the map turns with the aircraft its ring and N stay (the ring turns), with an arrow in it -->
      <svg viewBox="0 0 32 32">
        <g id="orient-rose">
          <circle cx="16" cy="16" r="13" stroke-width="2"/>
          <path class="o-needle" d="M16 6l4 10h-8z" stroke-width="1"/>
          <path class="o-south" d="M16 26l-4-10h8z" stroke-width="1.5"/>
          <text x="16" y="5.2" class="o-n" text-anchor="middle">N</text>
        </g>
        <path class="o-plane" d="M16 7.5L22.5 24L16 20L9.5 24Z"/>
      </svg>
    </button>
    <!-- about 30 km around the aircraft: a sensible zoom for charts that cover a whole region -->
    <button id="btn-regional" type="button" aria-label="Regional zoom">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11"/><path d="M16 8.5l4 11-4-2.5-4 2.5z"/></svg>
    </button>
    <button id="btn-fit" type="button" aria-label="Show whole chart">
      <svg viewBox="0 0 32 32"><path d="M5 12V5h7M20 5h7v7M27 20v7h-7M12 27H5v-7"/></svg>
    </button>
    <button id="btn-reload" type="button" aria-label="Reload">
      <svg viewBox="0 0 32 32"><path d="M26 16a10 10 0 1 1-3-7.1"/><path d="M24 4v6h-6"/></svg>
    </button>
  </div>

  <!-- Display: how the chart is shown. Same column style and width as the navigation buttons. -->
  <div id="display" class="controls displaycol">
    <button id="btn-close" type="button" class="closebtn" aria-label="Close chart">
      <svg viewBox="0 0 32 32"><path d="M9 9l14 14M23 9L9 23"/></svg>
    </button>
    <button id="view-overlay" type="button" aria-label="With map">
      <svg viewBox="0 0 32 32"><path d="M16 5l11 6-11 6-11-6z"/><path d="M5 17l11 6 11-6"/><path d="M5 22l11 6 11-6"/></svg>
    </button>
    <button id="view-chart" type="button" aria-label="Chart only">
      <svg viewBox="0 0 32 32"><rect x="8" y="4" width="16" height="24" rx="1.5"/><path d="M11 10h10M11 15h10M11 20h6"/></svg>
    </button>
    <!-- How much of the chart shows over the map: one button that steps through the levels -->
    <button id="btn-blend" type="button" aria-label="Chart over map">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11"/><circle class="lvl" cx="16" cy="16" r="7.5" stroke="none"/></svg>
    </button>
    <!-- Several charts on the map at once (only with the map) -->
    <button id="btn-multi" type="button" aria-label="Several charts">
      <svg viewBox="0 0 32 32"><rect x="4" y="9" width="17" height="17" rx="1.5"/><path d="M10 5h17.5v17.5"/><path d="M9 15h8M9 20h5"/></svg>
    </button>
  </div>

  <!-- Lower right corner, at most 30% of the width (the tablet's own menu is below): the map credit and
       the simulation-only notice, which must always be visible. -->
  <div class="brcorner">
    <div id="attribution" class="attribution">&copy; OpenStreetMap contributors</div>
    <div id="simnote" class="simnote"></div>
  </div>

  <script src="/geo.js"></script>
  <script src="/viewer.js"></script>
</body>
</html>
