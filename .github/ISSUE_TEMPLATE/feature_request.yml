name: Feature request
description: Suggest an idea or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Open Charts is for flight simulation only.**
        Requests that depend on real-world aviation use will not be accepted.

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Tell us what you are trying to do and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: How would you imagine it working?
      description: A sketch, a walkthrough or a reference to another program is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - In-sim viewer (EFB)
        - Manager
        - Chart sources (new source or improvement)
        - Import and chart naming
        - Flights and pinned charts
        - SimConnect / position
        - Installation
        - Other
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: If this is a new chart source
      description: Provider, country, where the charts are published, format (GeoPDF?) and whether the usage policy allows access.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and did not find this request.
          required: true
