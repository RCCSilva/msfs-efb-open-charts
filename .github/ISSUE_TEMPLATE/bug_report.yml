name: Bug report
description: Something does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Open Charts is for flight simulation only.**
        Thanks for reporting! The more detail you give, the faster it can be fixed.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See the error ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - In-sim viewer (EFB)
        - Manager (browser)
        - PDF import
        - Sources (DECEA, My PDFs)
        - Position / SimConnect
        - Installer
        - Tray icon
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Open Charts version
      description: See the About page of the manager.
      placeholder: "0.2.0 Open Beta"
    validations:
      required: true

  - type: dropdown
    id: msfs
    attributes:
      label: MSFS edition
      options:
        - MSFS 2024 (Steam)
        - MSFS 2024 (Microsoft Store / Xbox app)
        - Other
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the end of `%LOCALAPPDATA%\OpenCharts\opencharts.log`, or attach the file.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Screenshots and extra details
      description: Drag images here. If it is about a specific chart, give its name; do not attach PDFs whose terms forbid redistribution.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and did not find this problem.
          required: true
        - label: I did not include personal information or keys.
          required: true
